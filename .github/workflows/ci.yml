name: CI

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.go }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: go test -timeout=30s ./...
      - run: go vet ./...
      - if: runner.os == 'Linux'
        run: go test -race -count=20 -timeout=60s ./...
      - if: runner.os == 'Linux' && matrix.go == '1.27.x'
        run: go test -run='^$' -fuzz='^FuzzCheckpointReadiness$' -fuzztime=10s -parallel=2 -timeout=60s .

  required:
    name: Go CI
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every matrix job to pass
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
        run: test "$MATRIX_RESULT" = success
